<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastimes</title>

    <link rel="icon" href="/favicon-person-walking.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to top right, blue, purple, yellow);">

    <main class="container-fluid min-vh-100 py-4">

        <div class="container-xxl"> 
            <div class="app-shell bg-white rounded-4 border shadow-sm p-4 p-md-5">
                <!-- BRAND HEADER -->
                <header class="mb-5">
                    <h1 class="fw-bold mb-2">
                        <i class="bi bi-person-walking text-warning"></i>
                        Pastimes
                    </h1>
                    <p class="text-secondary mb-0">
                        Discover something new to do today.
                    </p>
                </header>

                <!-- LOGIN VIEW -->
                <div id="login-view" class="row justify-content-center">
                    <div class="col-md-7 col-lg-5">
                        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-light">
                            <h2 class="fw-bold mb-4">Welcome back</h2>
                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="login-username" class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                        id="login-username"
                                        class="form-control"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label for="login-password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                        id="login-password"
                                        class="form-control"
                                        required>
                                </div>

                                <p id="login-error" class="text-danger small"></p>

                                <button type="submit" class="btn btn-primary w-100">
                                    Log in
                                </button>
                            </form>

                            <p class="text-center mt-4 mb-2">
                                New here?
                                <a href="#" id="show-signup">Sign up</a>
                            </p>

                            <p class="text-center text-secondary small mb-0">
                                Demo account: admin / admin123
                            </p>
                        </div>
                    </div>
                </div>


                <!-- SIGNUP VIEW -->
                <div id="signup-view" class="d-none row justify-content-center">
                    <div class="col-md-7 col-lg-5">
                        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
                            <h2 class="fw-bold mb-4">Create an account</h2>
                            <form id="signup-form">
                                <div class="mb-3">
                                    <label for="signup-username" class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                        id="signup-username"
                                        class="form-control"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label for="signup-password" class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                        id="signup-password"
                                        class="form-control"
                                        required>
                                </div>

                                <p id="signup-error" class="text-danger small"></p>

                                <button type="submit" class="btn btn-primary w-100">
                                    Create account
                                </button>
                            </form>

                            <p class="text-center mt-4 mb-0">
                                Already have an account?
                                <a href="#" id="show-login">Log in</a>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- MAIN APP VIEW -->
                <div id="app-view" class="d-none">
                    <div class="row g-4 dashboard-layout">
                        <!-- LEFT SIDE: ACTIVITY GENERATOR -->
                        <div class="col-lg-8">
                            <div class="dashboard-left">
                                <!-- WELCOME -->
                                <div class="mb-4">
                                    <h2 class="fw-bold">
                                        Welcome back, <span id="welcome-name"></span>.
                                    </h2>

                                    <p class="text-secondary">
                                        What will you do today?
                                    </p>

                                    <button id="get-btn" class="btn btn-primary btn-lg mt-3">
                                        <i class="bi bi-stars me-2"></i>
                                        Get Activity
                                    </button>
                                </div>

                                <!-- ACTIVITY MESSAGE -->
                                <p id="activity-message" class="text-secondary mt-4">
                                    Nothing yet. Press the button.
                                </p>

                                <!-- GENERATED ACTIVITY -->
                                <div id="activity-box" class="d-none">
                                    <div class="card activity-card rounded-4 border-0 shadow-sm bg-light">
                                        <div class="card-body p-4 p-md-5">
                                            <h2 id="activity-title" class="fw-bold mb-4"></h2>
                                            <div id="activity-badges"
                                                class="d-flex flex-wrap gap-2 mb-4">
                                            </div>

                                            <a id="activity-link"
                                                class="d-none activity-link"
                                                target="_blank"
                                                rel="noopener noreferrer">
                                                <i class="bi bi-box-arrow-up-right me-1"></i>
                                                Open activity
                                            </a>

                                            <div class="mt-4">
                                                <button id="save-btn"
                                                    class="btn btn-outline-primary btn-lg bg-info">

                                                    <i class="bi bi-star-fill text-warning me-2"></i>
                                                    Save Activity
                                                </button>

                                                <p id="save-message"
                                                    class="text-success small mt-2 mb-0">
                                                </p>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT SIDE: SAVED ACTIVITIES -->
                        <div class="col-lg-4">
                            <div id="saved-panel" class="card saved-panel rounded-4 border-0 shadow-sm bg-light">
                                <div class="card-body p-4">
                                    <h4 class="fw-bold mb-4">
                                        <i class="bi bi-star-fill text-warning me-2"></i>
                                        Saved Activities
                                        <span class="text-secondary fs-6">
                                            (<span id="saved-count">0</span>)
                                        </span>
                                    </h4>

                                    <p id="saved-empty" class="text-secondary">
                                        Nothing saved yet.
                                    </p>

                                    <ul id="saved-list" class="list-group list-group-flush"></ul>

                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- LOGOUT -->
                    <div class="mt-5 pt-4">
                        <button id="logout-btn"
                            class="btn btn-link text-secondary text-decoration-none p-0">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
